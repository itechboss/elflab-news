    <body>
    <div class="container">
      <header>
        <h1>elflab.eu — DevOps &amp; AI Radar</h1>
        <p>Curated by elflab · Updated {{ generated_at }}</p>
      </header>
    
      <div class="filters">
        <button class="active" data-filter="all">All ({{ total_count }})</button>
        {% for cat in categories %}
        <button data-filter="{{ cat }}">{{ cat | replace('-', ' ') | title }}</button>
        {% endfor %}
      </div>
    
      <div class="cards">
        {% for item in items %}
        <div class="card" data-category="{{ item.category or 'tools' }}">
          <div class="card-title"><a href="{{ item.url }}" target="_blank" rel="noopener">{{ item.title }}</a></div>
          {% if item.description %}
          <div class="card-desc">{{ item.description }}</div>
          {% endif %}
          <div class="card-meta">
            <span class="badge badge-{{ item.category or 'tools' }}">{{ item.category or 'tools' }}</span>
            {% if item.source == 'github' %}
              <span class="stars">★ {{ "{:,}".format(item.stars or 0) }}</span>
              {% if item.velocity %}
              <span class="velocity">▲ {{ "%.0f" | format(item.velocity) }}/day</span>
              {% endif %}
              {% if item.language %}
              <span>{{ item.language }}</span>
              {% endif %}
            {% elif item.source == 'hn' %}
              <span class="stars">▲ {{ item.stars or 0 }} pts</span>
            {% elif item.source == 'youtube' %}
              <span class="yt">▶ {{ item.description }}</span>
            {% endif %}
            <span class="source">{{ item.source }}</span>
            {% if item.collected_at %}
            <span>{{ item.collected_at[:16] }}</span>
            {% endif %}
          </div>
        </div>
        {% else %}
        <div class="empty">No items yet. First collection is running...</div>
        {% endfor %}
      </div>
    
      <footer>
        <p><strong>elflab</strong> — DevOps · K8s / GitOps / AI Infra</p>
        <p style="margin-top:4px">
          <a href="https://github.com/itechboss">GitHub</a> ·
          <a href="/feed.xml">RSS Feed</a>
        </p>
        <p style="margin-top:4px">Updated {{ generated_at }}</p>
      </footer>
    </div>
    
    <script>
    document.querySelector('.filters').addEventListener('click', function(e) {
      if (e.target.tagName !== 'BUTTON') return;
      this.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      var f = e.target.dataset.filter;
      document.querySelectorAll('.card').forEach(function(c) {
        c.style.display = (f === 'all' || c.dataset.category === f) ? '' : 'none';
      });
    });
    </script>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elflab-news
  namespace: elflab-news
  labels:
    app: elflab-news
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elflab-news
  template:
    metadata:
      labels:
        app: elflab-news
      annotations:
        checksum/code: "6837d39c8dad76c2"
    spec:
      initContainers:
        - name: install-deps
          image: python:3.12-slim
          command:
            - pip
            - install
            - --target=/deps
            - --no-cache-dir
            - httpx==0.28.1
            - jinja2==3.1.6
            - aiohttp==3.11.18
            - apscheduler==3.10.4
            - feedparser==6.0.11
          volumeMounts:
            - name: deps
              mountPath: /deps
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: elflab-news
          image: python:3.12-slim
          command: ["python", "/app/main.py"]
          env:
            - name: PYTHONPATH
              value: "/deps:/app"
            - name: DATA_DIR
              value: "/data"
            - name: APP_DIR
              value: "/app"
            - name: PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: elflab-news-secrets
                  key: GITHUB_TOKEN
                  optional: true
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: deps
              mountPath: /deps
            - name: data
              mountPath: /data
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
      restartPolicy: Always
      volumes:
        - name: app-code
          configMap:
            name: elflab-news-code
        - name: deps
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: elflab-news-data
---
apiVersion: v1
kind: Service
metadata:
  name: elflab-news
  namespace: elflab-news
spec:
  selector:
    app: elflab-news
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elflab-news
  namespace: elflab-news
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - elflab.eu
      secretName: elflab-news-tls
  rules:
    - host: elflab.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elflab-news
                port:
                  number: 8080
