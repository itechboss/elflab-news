apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elflab-news
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/itechboss/elflab-news.git
    targetRevision: main
    path: k3s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: elflab-news
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
